# WAHA, deployed as an internal-only Fly app - not exposed to the public
# internet. Only other Fly apps in the same org can reach it, at
# whosday-waha.internal:3000 (see whosday-backend/fly.toml's WAHA_URL).
# Secrets (API key, dashboard/swagger credentials) are set separately via
# `flyctl secrets set`, not stored here - see ../DEPLOY.md.

app = "whosday-waha"
primary_region = "cdg"

[build]
  image = "devlikeapro/waha:latest"

[env]
  # GOWS (Go/whatsmeow) is browserless like NOWEB (cheap, hundreds of sessions
  # per machine) but a different codebase - it should send media reliably,
  # unlike NOWEB whose media upload to WhatsApp's servers is broken.
  WHATSAPP_DEFAULT_ENGINE = "GOWS"
  # Keep users' phones receiving WhatsApp notifications. By default WAHA
  # marks the linked account "online", which makes WhatsApp treat it as an
  # active device and stop pushing notifications to the phone. Disabling
  # auto-online (plus markOnline:false at session start, see waha.js) leaves
  # the phone as the primary, notified device.
  WAHA_PRESENCE_AUTO_ONLINE = "False"

[[mounts]]
  source = "waha_sessions"
  destination = "/app/.sessions"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
