# WhosDay backend - the only piece exposed to the public internet (the
# phone app talks to this). Secrets (WAHA_API_KEY, SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY) are set separately via `flyctl secrets set`,
# not stored here - see ../DEPLOY.md.

app = "whosday-backend"
primary_region = "cdg"

[build]

[env]
  PORT = "5000"
  # whosday-waha.internal only resolves between Fly apps in the same org's
  # private network - this is not reachable from the public internet.
  WAHA_URL = "http://whosday-waha.internal:3000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
